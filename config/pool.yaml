# ============================================================
# 模型池定义 — 你需要在这里添加你自己的模型和通道
# 以下是一个示例，取消注释 + 填入你的凭据即可使用
# ============================================================
#
# 字段说明：
#   providers:   API 通道定义（base_url + 凭据名）
#   models:      模型列表（id + 可用通道 + 成本 + 类型）
#   banned: true   → 禁用该模型（不参与路由）
#   unreliable: true → 易限流，仅作最后手段
#   worker: false  → 该通道只作大脑驱动、不作工人（派活时跳过）
#
# 使用方式：
# 1. 在 providers 里添加你的 API 通道
# 2. 在 models 里添加你能用的模型
# 3. 凭据存放在 ~/.dsh/.credentials.yaml 或同名环境变量
# 4. 改完即刻生效，无需重启

providers:
  # 示例通道（取消注释，填入你的配置）：
  # my_channel:
  #   base_url: https://api.example.com/v1
  #   credential_key: MY_API_KEY
  #   note: 你的 API 通道

models:
  # 示例模型（取消注释，填入你的模型）：
  # my-model:
  #   kind: general
  #   cost: free
  #   context: 131072
  #   providers:
  #     - {channel: my_channel, dsh_provider: my_channel}
