# ============================================================
# 模型池定义 — QuantOS 路由大脑 (2026-08-30 重建)
# 通道: volc(火山编码) / opencode(仅大脑) / openrouter(免费池) / bai(隧道)
# 凭据: ~/.dsh/.credentials.yaml 或同名环境变量
# ============================================================

providers:
  volc:
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    credential_key: ARK_CODING_API_KEY
    note: 火山引擎编码套餐（周配额 8-31 前耗尽勿首选）
  opencode:
    base_url: https://opencode.ai/zen/go/v1
    credential_key: OPENCODE_GO_API_KEY
    worker: false            # opencode 只作大脑驱动，不作工人通道（用户要求）
    note: OpenCode Go（仅大脑使用）
  openrouter:
    base_url: https://openrouter.ai/api/v1
    credential_key: OPENROUTER_API_KEY
    note: OpenRouter 聚合（免费模型池，worker 可用）
  bai:
    base_url: https://api.b.ai/v1
    credential_key: BAI_API_KEY
    tunnel_host: 127.0.0.1
    tunnel_port: 8443
    note: api.b.ai（经 SSH 隧道 ~/.dsh/start-bai-tunnel.sh，仅 direct 模式可用；本机直连被墙）

models:
  # ── bai 通道（免费，隧道，worker 可用）──────────────
  qwen3.8-flash:
    kind: general
    cost: free
    context: 1000000
    providers:
      - {channel: bai, dsh_provider: bai}
    roles: [qa, classify, extract, fallback]
    note: bai 免费主力（最稳）
  deepseek-v4-flash:
    kind: reasoning
    cost: low
    context: 1000000
    providers:
      - {channel: bai, dsh_provider: bai}
      - {channel: volc, dsh_provider: volc-coding}
    roles: [math, complex, plan, extract]
  deepseek-v4-flash-vision-exp:
    kind: vision
    cost: low
    context: 1000000
    providers:
      - {channel: bai, dsh_provider: bai}
      - {channel: opencode, dsh_provider: opencode-go-zen}
    roles: [vision]
  glm-5.3-flash:
    kind: general
    cost: low
    context: 1000000
    providers:
      - {channel: bai, dsh_provider: bai}
      - {channel: opencode, dsh_provider: opencode-go-zen}
