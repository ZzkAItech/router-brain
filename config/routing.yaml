  complex:  [复杂, 深入, 权衡, 分析, 推理, 论证, 为什么, 如何设计, 研究, 对比方案, complex, deep, tradeoff, analysis, reasoning, argue, why, how to design, research, compare]
  longtext: [长文, 总结, 报告, 文档, 综述, 分析报告, 万字, 长文本, long, summary, report, document, review, survey, essay]
  translate: [翻译, translate, translation, 英译中, 中译英, 润色中文, english to chinese, chinese to english]
  zh:       [中文, 汉语, 措辞, 语气, 中文表达, chinese, mandarin, phrasing, tone, idiom, sinology, classical chinese, 文言文, vernacular chinese, cultural nuance, sinic expression, hanzi, pinyin]
  writing:  [文案, 文章, 写作, 标题, 广告语, 宣传, 软文, 故事, 剧本, 演讲稿, copy, article, writing, title, headline, ad copy, promotion, story, speech, copywriting, content writing, blog post, editorial, professional writing, essay, literature, literary analysis]
  creative: [创意, 头脑风暴, 点子, 灵感, 命名, 方案创意, creative, brainstorm, idea, inspiration, naming, campaign, imagine, innovate, ideation, invent, conceptualize, design thinking, lateral thinking, wordplay, tagline, brand name]
  vision:   [看图, 图片, 截图, 图像, 识别图中, ocr, 照片, 视觉, 多模态, look at, image, screenshot, picture, photo, visual, multimodal, computer vision, image recognition, visual AI, visual understanding, photo analysis, scene recognition, object detection]
  qa:       [是什么, 什么是, 什么意思, 区别, 对比, 快问, 一句话, 简述, 定义, 常见问题, what is, what are, meaning, difference, compare, quick, brief, definition, faq, short answer]
  classify: [分类, 归类, 标签, 打标, 判断属于, 类型判断, classify, categorize, label, tag, determine type]
  extract:  [提取, 摘要, 关键词, 结构化, json输出, 解析出, 从文本中, extract, summarize, keyword, structured, json output, parse, from text]

direct_execution: [qa, classify, extract]

# 执行参数
execution:
  max_retries: 2                 # 同一通道/模型的瞬态失败重试次数（429/超时/5xx/空结果）
  max_fallbacks: 4               # 换通道/换模型的降级次数上限
  timeout_seconds: 600           # agent 模式单任务默认超时
  direct_max_tokens: 2048        # direct 模式 token 预算（推理型模型必须 ≥1024）
  circuit_breaker_failures: 3    # 同一 (模型,通道) 连续失败 N 次后熔断
  circuit_breaker_cooldown: 60   # 熔断冷却秒数
  auto_failover: false           # 模型失败时是否由引擎自动换模型（false=停下来让大脑决定换哪个）
  force_channel: ""              # 空=全部通道参与；填某通道名=只走该通道
  dsh_tools_mode: native         # headless 工具模式：native | code | both
  run_dir: .run                  # 每次运行的 settings/patch/日志落盘目录
  session_cleanup: true
  # 模型停服/不存在错误（discontinued/not found/deprecated）视为永久失败，立即熔断该模型
  permanent_model_errors: ["UNKNOWN_MODEL", "Model.*not found", "has been deprecated", "not supported", "Model is unavailable", "model is not supported", "no configured model"]
