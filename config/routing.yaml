# ============================================================
# 路由规则 — 已移除「任务类型 → 模型链」的硬分工
# 分工由大脑智能决定（看任务性质 + 当前模型可用性），不再写死。
# 本文件只保留：分类关键词（给大脑作判断提示）、执行模式、执行参数。
# ============================================================

# 分类关键词表（中文 + 英文）：大脑判断子任务性质时参考。
# 不再直接映射到模型——模型由大脑自选 + 失败时大脑决定替换模型。
