# 示例模型池 — 复制为 config/pool.yaml 后按你的真实配置填写
# 这里展示：一个 OpenAI 兼容通道 + 两个示例模型（一个便宜、一个贵）
# 凭据放在 ~/.dsh/.credentials.yaml 或同名环境变量，框架自动读取

providers:
  my_primary:
    base_url: https://api.your-provider.com/v1
    credential_key: MY_PROVIDER_KEY   # 环境变量名或 ~/.dsh/.credentials.yaml 里的键
    note: 你的主 API 通道

  my_secondary:
    base_url: https://api.another-provider.com/v1
    credential_key: ANOTHER_KEY
    note: 备用通道（主通道挂了自动切）

models:
  fast-cheap-model:
    kind: general
    cost: free
    context: 131072
    providers:
      - {channel: my_primary, dsh_provider: my_primary}

  strong-reasoning-model:
    kind: reasoning
    cost: medium
    context: 131072
    providers:
      - {channel: my_secondary, dsh_provider: my_secondary}
      - {channel: my_primary, dsh_provider: my_primary}   # 双通道：备用自动切换
