[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-brain"
version = "1.1.4"
description = "决策与执行分离的 AI 编排框架：大脑专注决策、不被细节干扰，工人独立干活、上下文短小。自动拆解→选模型→派活→看反馈→迭代，多模型交叉验证对抗幻觉，便宜优先省成本。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "router-brain contributors" }]
keywords = ["llm", "routing", "agent", "deepseek-harness", "model-router", "multi-model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
router-brain = "router_brain.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
